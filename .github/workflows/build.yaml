name: Build patched firecrawl-mcp image

# Images are pushed by digest only; the digest is printed in the run summary.

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      fc_ref:
        description: 'firecrawl-mcp-server ref to build (default: newest stable vX.Y.Z tag)'
        required: false
        default: ''
      force:
        description: 'Rebuild and push even if this tag + patch set was already published'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

env:
  FC_GH_REPO: firecrawl/firecrawl-mcp-server
  IMAGE: ghcr.io/koreapyj/firecrawl-mcp

jobs:
  resolve:
    name: Resolve upstream tag and patch revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fc_ref: ${{ steps.resolve.outputs.fc_ref }}
      rev: ${{ steps.resolve.outputs.rev }}
      publish: ${{ steps.resolve.outputs.publish }}
      marker: ${{ steps.resolve.outputs.marker }}
      has_work: ${{ steps.work.outputs.has_work }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FC_REF: ${{ inputs.fc_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_FC_REF:-}" ]; then
            fc_ref="${INPUT_FC_REF}"
          else
            fc_ref="$(bash support/latest-tag.sh)"
          fi

          # Hash of everything that changes the build on top of upstream.
          rev="$( { cat patches/series; \
                    find patches -name '*.patch' -type f | LC_ALL=C sort | xargs -r cat; \
                    cat support/apply-patches.sh; } | sha256sum | cut -c1-12 )"

          publish=false
          if [ "${GITHUB_EVENT_NAME}" != pull_request ] && [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            publish=true
          fi

          {
            echo "fc_ref=${fc_ref}"
            echo "rev=${rev}"
            echo "publish=${publish}"
            echo "marker=published-${fc_ref}-${rev}"
          } >> "${GITHUB_OUTPUT}"

      # Without tags there is nothing to look up in the registry, so a cache
      # entry marks a published (tag, patch set). Eviction only causes a rebuild.
      - name: Look up publish marker
        id: marker
        if: steps.resolve.outputs.publish == 'true' && inputs.force != true
        uses: actions/cache/restore@v4
        with:
          path: .published
          key: ${{ steps.resolve.outputs.marker }}
          lookup-only: true

      - name: Decide
        id: work
        env:
          FC_REF: ${{ steps.resolve.outputs.fc_ref }}
          REV: ${{ steps.resolve.outputs.rev }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
          MARKER_HIT: ${{ steps.marker.outputs.cache-hit }}
        run: |
          has_work=true
          if [ "${MARKER_HIT}" = true ]; then
            echo "::notice::${FC_REF} + patches ${REV} already published -- nothing to do."
            has_work=false
          fi
          echo "has_work=${has_work}" >> "${GITHUB_OUTPUT}"
          {
            echo "### firecrawl-mcp-server \`${FC_REF}\` + patches \`${REV}\`"
            echo "- publish: ${PUBLISH}"
            echo "- has_work: ${has_work}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build, smoke-test and push
    needs: resolve
    if: needs.resolve.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      FC_REF: ${{ needs.resolve.outputs.fc_ref }}
      REV: ${{ needs.resolve.outputs.rev }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone firecrawl-mcp-server
        run: |
          echo "Cloning firecrawl-mcp-server '${FC_REF}'"
          git clone --depth 1 --branch "${FC_REF}" "https://github.com/${FC_GH_REPO}.git" src

      - name: Install quilt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends quilt

      - name: Apply patches (fuzz=0)
        run: bash support/apply-patches.sh src

      - name: Set up QEMU
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, local)
        run: |
          docker buildx build src \
            --platform linux/amd64 \
            --load \
            --tag firecrawl-mcp-patched:ci

      - name: Smoke test
        run: bash support/smoke.sh firecrawl-mcp-patched:ci

      - name: Log in to GHCR
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image by digest (no tags)
        if: needs.resolve.outputs.publish == 'true'
        run: |
          set -euo pipefail
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker buildx build src \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${source_url}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${FC_REF}-${REV}" \
            --label "org.opencontainers.image.base.name=${GITHUB_SERVER_URL}/${FC_GH_REPO}@${FC_REF}" \
            --annotation "index:org.opencontainers.image.source=${source_url}" \
            --annotation "index:org.opencontainers.image.version=${FC_REF}-${REV}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${RUNNER_TEMP}/metadata.json"
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")"
          if [ -z "${digest}" ] || [ "${digest}" = null ]; then
            echo "error: no digest in build metadata" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE}@${digest}"
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo "firecrawl-mcp-server \`${FC_REF}\` + patches \`${REV}\` (linux/amd64, linux/arm64)"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Published image::${IMAGE}@${digest}"
          mkdir -p .published
          echo "${IMAGE}@${digest}" > .published/digest

      - name: Record publish marker
        if: needs.resolve.outputs.publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: .published
          key: ${{ needs.resolve.outputs.marker }}
